# dsh-tui-secret — a one-row plugin. Every key in `config` has a default (see lib/types/index.js).
#
# The row is loaded by the dsh-tui profile composition. It activates after the first frame,
# so `apply` must not await and must not use ctx.root capabilities.
- insert:
    - id: dsh-tui-secret
      name: dsh-tui-secret
      config:
        entryCommand: secrets
        # echo: dots    # one '•' per character (default); 'none' draws nothing at all
